<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Polling App</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 15px; }
    nav { display: flex; justify-content: space-between; align-items: center;
          border-bottom: 2px solid #41719c; padding-bottom: 10px; margin-bottom: 20px; }
    nav a { color: #41719c; text-decoration: none; margin-right: 10px; }
    .error { color: #b00020; margin: 10px 0; }
    label { display: block; margin: 8px 0; }
    button { background: #41719c; color: white; border: 0; padding: 8px 16px; cursor: pointer; }
    .inline { display: inline; }
  </style>
</head>
<body>
  <nav>
    <div><a href="{% url 'polls:index' %}"><strong>Polling App</strong></a></div>
    <div>
      {% if user.is_authenticated %}
        Hi, {{ user.username }}
        <!-- Logout must be a POST request, so it needs a CSRF token -->
        <form class="inline" method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'polls:signup' %}">Sign up</a>
      {% endif %}
    </div>
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
